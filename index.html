<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ImmoRadar Location</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/leaflet.css"/>
<script src="/static/leaflet.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#080f1a;color:#c8dff0;font-family:'DM Sans',sans-serif;min-height:100vh}
  input,select{font-family:'DM Sans',sans-serif}
  button{font-family:'DM Sans',sans-serif;cursor:pointer}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:#0a1520}
  ::-webkit-scrollbar-thumb{background:#1a3a5a;border-radius:3px}
  .topbar{background:linear-gradient(90deg,#0a1525,#0d1e30);border-bottom:1px solid #1a2d40;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
  .logo{font-size:20px;font-weight:800;font-family:'DM Serif Display',serif;color:#e0eaf5;letter-spacing:-0.5px}
  .logo span{font-size:13px;font-weight:400;color:#3a6a9a;font-family:'DM Sans',sans-serif}
  .subtitle{font-size:11px;color:#2a4a6a;margin-top:3px}
  .topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .search-input{background:#0d1621;border:1px solid #1e2d3d;border-radius:8px;color:#c8dff0;padding:7px 12px;font-size:13px;outline:none;width:180px}
  .search-input:focus{border-color:#2a5a8a}
  .btn-refresh,.view-toggle button{background:#1a3a5a;border:1px solid #2a5a8a;border-radius:8px;color:#7ac3f0;padding:7px 14px;font-size:13px;font-weight:600;transition:background 0.15s}
  .btn-refresh:hover,.view-toggle button:hover{background:#1e4a70}
  .btn-refresh:disabled{background:#0d1621;color:#2a4a6a;cursor:default}
  .view-toggle{display:flex;gap:4px;background:#0d1621;border:1px solid #1e2d3d;border-radius:8px;padding:3px}
  .view-toggle button{background:transparent;border:none;color:#3a6a9a;padding:6px 12px}
  .view-toggle button.active{background:#1a3a5a;color:#7ac3f0}
  .main{max-width:980px;margin:0 auto;padding:22px 16px}
  .filters-bar{background:#0d1621;border:1px solid #1a2d40;border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .filter-label{font-size:12px;color:#3a6a9a;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .filter-group{display:flex;align-items:center;gap:7px}
  .filter-group label{font-size:12px;color:#5a8aaa}
  .filter-input{background:#080f1a;border:1px solid #1e2d3d;border-radius:6px;color:#c8dff0;padding:4px 8px;font-size:13px;width:90px;font-family:'DM Sans',sans-serif;outline:none}
  .filter-checkbox{display:flex;align-items:center;gap:6px;font-size:12px;color:#5a8aaa}
  .filter-meta{font-size:12px;color:#2a4a6a;margin-left:auto}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{background:#0d1621;border:1px solid #1e2d3d;border-radius:8px;color:#3a6a9a;padding:7px 14px;font-size:13px;transition:all 0.15s}
  .tab.active{background:#1a3a5a;border-color:#2a6aaa;color:#7ac3f0;font-weight:700}
  .tab-count{margin-left:6px;background:#0a1520;border-radius:10px;padding:1px 7px;font-size:11px}
  .tab.active .tab-count{background:#2a5a8a}
  .card{background:linear-gradient(135deg,#111c2b,#0d1621);border-radius:12px;margin-bottom:11px;overflow:hidden;transition:box-shadow 0.2s;border:1px solid #1a2d40}
  .card.nouveau{border-color:#00d68f55}
  .card-header{padding:13px 17px;cursor:pointer;display:flex;align-items:flex-start;gap:12px}
  .card-header:hover{background:rgba(255,255,255,0.02)}
  .card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
  .badge{border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:0.3px;white-space:nowrap}
  .badge-dist{background:#1a3a5a33;color:#7ac3f0;border:1px solid #2a5a8a55}
  .badge-nouveau{background:#00d68f22;color:#00d68f;border:1px solid #00d68f55}
  .source-badge{font-size:11px;color:#3a5a7a;background:#0a1520;border-radius:4px;padding:2px 7px}
  .age-badge{font-size:11px;color:#3a5a7a}
  .card-title{font-size:15px;font-weight:700;color:#c8dff0;margin-bottom:3px;font-family:'DM Serif Display',serif;line-height:1.3}
  .card-loc{font-size:13px;color:#4a7a9a}
  .card-price{text-align:right;flex-shrink:0}
  .card-price .main-price{font-size:18px;font-weight:800;color:#e0eaf5;font-variant-numeric:tabular-nums}
  .card-price .price-m2{font-size:12px;color:#3a5a7a}
  .card-detail{border-top:1px solid #1a2d40;padding:15px 17px}
  .desc-text{font-size:13px;color:#5a8aaa;line-height:1.6;margin-bottom:14px;white-space:pre-line}
  .btn-annonce{display:inline-flex;align-items:center;gap:6px;margin-top:2px;background:#1a3a5a;color:#7ac3f0;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;text-decoration:none;border:none;transition:background 0.15s}
  .btn-annonce:hover{background:#1e4a70}
  .empty{text-align:center;padding:60px;color:#2a4a6a}
  .empty-icon{font-size:36px;margin-bottom:12px}
  .legend{margin-top:22px;padding:15px 19px;background:#0a1520;border-radius:10px;border:1px solid #1a2d40;font-size:12px;color:#3a5a7a;line-height:2.1}
  .legend strong{color:#5a8aaa}
  .spinner{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .error-banner{background:#2a1010;border:1px solid #5a2020;border-radius:8px;padding:10px 16px;margin-bottom:14px;font-size:13px;color:#ff8888}
  .sources-info{background:#0d1825;border:1px solid #1a3040;border-radius:8px;padding:10px 16px;margin-bottom:14px;font-size:12px;color:#3a6a9a;display:flex;gap:14px;flex-wrap:wrap}
  .sources-info span{color:#5a9aca}
  .new-dot{display:inline-block;width:7px;height:7px;background:#00d68f;border-radius:50%;margin-right:5px;vertical-align:middle;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #map{height:600px;border-radius:12px;border:1px solid #1a2d40;margin-bottom:18px;background:#0d1621}
  .leaflet-popup-content-wrapper{background:#111c2b;color:#c8dff0;border-radius:10px}
  .leaflet-popup-tip{background:#111c2b}
  .popup-price{font-weight:800;font-size:15px;color:#e0eaf5}
  .popup-title{font-size:12px;color:#7ac3f0;margin:3px 0 6px}
  .popup-link{font-size:12px;color:#7ac3f0}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="logo">🏠 ImmoRadar <span>Location</span></div>
    <div class="subtitle" id="refresh-info">Chargement des annonces…</div>
  </div>
  <div class="topbar-right">
    <div class="view-toggle">
      <button id="btn-view-list" class="active" onclick="setView('list')">📋 Liste</button>
      <button id="btn-view-map" onclick="setView('map')">🗺️ Carte</button>
    </div>
    <input class="search-input" id="search-input" placeholder="Ville, titre…" oninput="renderAll()"/>
    <button class="btn-refresh" id="btn-refresh" onclick="loadAnnonces()">⟳ Actualiser</button>
  </div>
</div>

<div class="main">

  <div class="filters-bar">
    <span class="filter-label">Filtres</span>
    <div class="filter-group">
      <label>Loyer max</label>
      <input class="filter-input" id="prix-max" type="number" step="50" oninput="renderAll()"/>
    </div>
    <div class="filter-group">
      <label>Surface min</label>
      <input class="filter-input" id="surface-min" type="number" step="5" oninput="renderAll()"/>
    </div>
    <div class="filter-group">
      <label>Pièces min</label>
      <input class="filter-input" id="pieces-min" type="number" step="1" oninput="renderAll()"/>
    </div>
    <div class="filter-checkbox">
      <input type="checkbox" id="only-new" onchange="renderAll()"/>
      <label for="only-new">Nouveautés uniquement</label>
    </div>
    <div class="filter-meta" id="filter-meta"></div>
  </div>

  <div id="sources-info" class="sources-info" style="display:none"></div>
  <div id="error-banner" class="error-banner" style="display:none"></div>

  <div class="tabs" id="tabs"></div>

  <div id="map" style="display:none"></div>
  <div id="annonces-list"></div>

  <div class="legend" id="legend"></div>
</div>

<script>
// ─── ÉTAT GLOBAL ─────────────────────────────────────────────────────────────
let allAnnonces = [];
let expandedId  = null;
let activeTab   = "tous";
let currentView = "list";
let meta        = {center:{lat:43.6486,lon:7.1246}, radius_km:10, ville_centre:"Villeneuve-Loubet", surface_min:35, price_max:1300, rooms_min:2, refresh_min:10};
let map, radiusCircle, markersLayer;

// ─── CHARGEMENT META + API ────────────────────────────────────────────────────
async function loadMeta(){
  try{
    const res = await fetch("/api/meta");
    if(res.ok) meta = await res.json();
  }catch(e){ /* garde les valeurs par défaut */ }
  document.getElementById("prix-max").value    = meta.price_max;
  document.getElementById("surface-min").value = meta.surface_min;
  document.getElementById("pieces-min").value  = meta.rooms_min;
  document.getElementById("legend").innerHTML = `
    <strong>Zone surveillée :</strong> ${meta.radius_km} km autour de ${meta.ville_centre}<br/>
    <strong>Critères par défaut :</strong> ≥ ${meta.surface_min} m² · pas de studio (≥ ${meta.rooms_min} pièces) · ≤ ${meta.price_max} €/mois<br/>
    <strong>Sources :</strong> Leboncoin · PAP · SeLoger · Bien'ici — refresh auto toutes les ${meta.refresh_min} min<br/>
    <span class="new-dot"></span> = annonce détectée pour la première fois il y a moins de 24h
  `;
}

function parseAnnonce(raw){
  return {
    id:        raw.id,
    source:    raw.source,
    titre:     raw.titre || "Annonce",
    desc:      raw.desc || "",
    prix:      raw.prix || 0,
    ville:     raw.ville || "",
    surface:   raw.surface || 0,
    pieces:    raw.pieces || null,
    lat:       raw.lat,
    lon:       raw.lon,
    distance:  raw.distance_km,
    link:      raw.link || "#",
    image:     raw.image || "",
    nouveau:   !!raw.nouveau,
    firstSeen: new Date((raw.first_seen||0)*1000),
  };
}

async function loadAnnonces(){
  const btn = document.getElementById("btn-refresh");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner">⟳</span> Chargement…';
  document.getElementById("refresh-info").textContent = "Récupération en cours…";

  try{
    const res = await fetch("/api/annonces", {signal: AbortSignal.timeout(20000)});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json = await res.json();
    allAnnonces = (json.annonces||[]).map(parseAnnonce).sort((a,b)=>b.firstSeen-a.firstSeen);

    document.getElementById("error-banner").style.display="none";
    document.getElementById("sources-info").style.display="flex";
    const srcHtml = Object.entries(json.sources||{}).map(([name,s])=>
      s.ok ? `<span>${name}: ${s.retenues}</span>` : `<span style="color:#ff8888">${name}: erreur</span>`
    ).join(" · ");
    const age = json.age_min!=null ? `Données de ${json.age_min} min` : "En attente du premier scraping";
    document.getElementById("sources-info").innerHTML = `<span>${allAnnonces.length} annonces</span> · ${age} · ${srcHtml||"aucune source"}`;

    if(allAnnonces.length===0){
      document.getElementById("error-banner").style.display="block";
      document.getElementById("error-banner").innerHTML =
        `⚠️ <strong>Aucune annonce pour l'instant</strong> — le serveur scrape les 4 sources au démarrage (peut prendre 1-2 min), ou aucune annonce ne correspond aux critères actuellement.`;
    }
  }catch(e){
    document.getElementById("error-banner").style.display="block";
    document.getElementById("error-banner").innerHTML = `⚠️ <strong>Erreur de chargement</strong> — ${e.message}`;
  }

  document.getElementById("refresh-info").textContent =
    `Dernière MAJ : ${new Date().toLocaleTimeString("fr-FR")} · Refresh auto toutes les ${meta.refresh_min} min`;
  btn.disabled=false;
  btn.innerHTML="⟳ Actualiser";
  renderAll();
}

// ─── FILTRES / RENDU ──────────────────────────────────────────────────────────
function esc(s){
  const d = document.createElement("div");
  d.textContent = s==null?"":String(s);
  return d.innerHTML;
}
function safeHref(u){
  return /^https?:\/\//i.test(u||"") ? esc(u) : "#";
}
function fmt(n){return Math.round(n).toLocaleString("fr-FR");}
function ageStr(date){
  const m=Math.round((Date.now()-date)/60000);
  if(m<1) return "à l'instant";
  if(m<60) return "il y a "+m+"min";
  if(m<1440) return "il y a "+Math.round(m/60)+"h";
  return "il y a "+Math.round(m/1440)+"j";
}

function getFiltered(){
  const pMax  = parseInt(document.getElementById("prix-max").value)||999999;
  const sMin  = parseInt(document.getElementById("surface-min").value)||0;
  const rMin  = parseInt(document.getElementById("pieces-min").value)||0;
  const onlyNew = document.getElementById("only-new").checked;
  const q     = document.getElementById("search-input").value.toLowerCase();
  return allAnnonces.filter(a=>{
    if(a.prix>pMax) return false;
    if(a.surface>0 && a.surface<sMin) return false;
    if(a.pieces && a.pieces<rMin) return false;
    if(onlyNew && !a.nouveau) return false;
    if(q && !a.titre.toLowerCase().includes(q) && !a.ville.toLowerCase().includes(q)) return false;
    if(activeTab!=="tous" && a.source!==activeTab) return false;
    return true;
  });
}

function renderTabs(){
  const sources = ["Leboncoin","PAP","SeLoger","Bien'ici"];
  const tabs = [{key:"tous",label:"Toutes",count:allAnnonces.length}]
    .concat(sources.map(s=>({key:s,label:s,count:allAnnonces.filter(a=>a.source===s).length})));
  document.getElementById("tabs").innerHTML=tabs.map(t=>`
    <button class="tab${activeTab===t.key?" active":""}" data-tab-key="${esc(t.key)}">
      ${esc(t.label)}<span class="tab-count">${t.count}</span>
    </button>`).join("");
}

function renderCard(a){
  const exp = expandedId===a.id;
  return `
  <div class="card${a.nouveau?" nouveau":""}" id="card-${esc(a.id)}" data-card-id="${esc(a.id)}">
    <div class="card-header">
      <div style="flex:1;min-width:0">
        <div class="card-meta">
          ${a.nouveau?'<span class="badge badge-nouveau"><span class="new-dot"></span>NOUVEAU</span>':""}
          ${a.distance!=null?`<span class="badge badge-dist">📍 ${a.distance} km</span>`:""}
          <span class="source-badge">${esc(a.source)}</span>
          <span class="age-badge">🕐 vu ${ageStr(a.firstSeen)}</span>
        </div>
        <div class="card-title">${esc(a.titre)}</div>
        <div class="card-loc">${esc(a.ville)}${a.surface>0?" · "+a.surface+" m²":""}${a.pieces?" · "+a.pieces+" pièces":""}</div>
      </div>
      <div class="card-price">
        <div class="main-price">${fmt(a.prix)} €<span style="font-size:11px;color:#3a5a7a">/mois</span></div>
        ${a.surface>0?`<div class="price-m2">${fmt(a.prix/a.surface)} €/m²</div>`:""}
      </div>
    </div>
    ${exp?`
    <div class="card-detail">
      <p class="desc-text">${esc(a.desc)||"Pas de description disponible."}</p>
      <a class="btn-annonce" href="${safeHref(a.link)}" target="_blank" rel="noopener">Voir l'annonce →</a>
    </div>`:""}
  </div>`;
}

function renderAll(){
  renderTabs();
  const filtered = getFiltered();

  const list = document.getElementById("annonces-list");
  if(allAnnonces.length===0){
    list.innerHTML=`<div class="empty"><div class="empty-icon">⟳</div>Chargement…</div>`;
  } else if(filtered.length===0){
    list.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div>Aucune annonce ne correspond aux critères.</div>`;
  } else if(currentView==="list"){
    list.innerHTML = filtered.map(renderCard).join("");
  } else {
    list.innerHTML = "";
  }

  if(currentView==="map") renderMap(filtered);
}

function toggleCard(id){
  expandedId = expandedId===id?null:id;
  renderAll();
  if(expandedId!==null){
    setTimeout(()=>document.getElementById("card-"+CSS.escape(id))?.scrollIntoView({behavior:"smooth",block:"nearest"}),50);
  }
}

function setTab(key){
  activeTab=key;
  renderAll();
}

document.getElementById("tabs").addEventListener("click", e=>{
  const btn = e.target.closest(".tab");
  if(btn) setTab(btn.dataset.tabKey);
});
document.getElementById("annonces-list").addEventListener("click", e=>{
  const card = e.target.closest(".card");
  if(card && !e.target.closest(".btn-annonce")) toggleCard(card.dataset.cardId);
});

function setView(view){
  currentView = view;
  document.getElementById("btn-view-list").classList.toggle("active", view==="list");
  document.getElementById("btn-view-map").classList.toggle("active", view==="map");
  document.getElementById("map").style.display = view==="map" ? "block" : "none";
  document.getElementById("annonces-list").style.display = view==="list" ? "block" : "none";
  if(view==="map") setTimeout(()=>{ initMap(); map.invalidateSize(); renderAll(); }, 0);
}

// ─── CARTE ─────────────────────────────────────────────────────────────────
function initMap(){
  if(map) return;
  map = L.map('map').setView([meta.center.lat, meta.center.lon], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);
  radiusCircle = L.circle([meta.center.lat, meta.center.lon], {
    radius: meta.radius_km*1000, color:'#2a6aaa', weight:1, fillColor:'#2a6aaa', fillOpacity:0.06, dashArray:'6,6',
  }).addTo(map);
  L.marker([meta.center.lat, meta.center.lon], {
    icon: L.divIcon({className:'', html:'<div style="background:#00d68f;width:12px;height:12px;border-radius:50%;border:2px solid #fff"></div>', iconSize:[12,12]})
  }).addTo(map).bindPopup(meta.ville_centre);
  markersLayer = L.layerGroup().addTo(map);
}

function renderMap(filtered){
  if(!map) return;
  markersLayer.clearLayers();
  const withGeo = filtered.filter(a=>a.lat!=null && a.lon!=null);
  withGeo.forEach(a=>{
    const color = a.nouveau ? '#00d68f' : '#7ac3f0';
    const marker = L.circleMarker([a.lat, a.lon], {
      radius:8, color, weight:2, fillColor:color, fillOpacity:0.5,
    });
    marker.bindPopup(`
      <div class="popup-price">${fmt(a.prix)} €/mois</div>
      <div class="popup-title">${esc(a.titre)}</div>
      <div style="font-size:12px;color:#5a8aaa;margin-bottom:6px">${esc(a.ville)}${a.surface>0?" · "+a.surface+" m²":""} · ${esc(a.source)}</div>
      <a class="popup-link" href="${safeHref(a.link)}" target="_blank" rel="noopener">Voir l'annonce →</a>
    `);
    marker.addTo(markersLayer);
  });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(async function init(){
  await loadMeta();
  await loadAnnonces();
  setInterval(loadAnnonces, 2*60*1000); // poll toutes les 2 min (lecture DB seulement, pas de re-scraping)
})();
</script>
</body>
</html>
